# Checks every push to main and every pull request: types, lint, frontend tests, Rust tests.
# Runs on GitHub's macOS runners (free for public repos), where the app is built and used.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Translations
        run: |
          node scripts/i18n-extract.mjs
          git diff --exit-code src/locales/en.json || (echo "Run node scripts/i18n-extract.mjs and commit src/locales/en.json" && exit 1)
          node scripts/i18n-validate.mjs
      - name: Rust tests
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && [ -f ../dist/index.html ] || echo '<!doctype html>' > ../dist/index.html
          cargo test --lib
